[workspace]
members = [
    "resolve-cli",
    "resolve-cli/src/resolve/reach",
    "resolve-facts/rs",
    "resolve-cveassert/libresolve",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binary manipulation
object = "0.37"
memmap2 = "0.9"

# Async (SBOM only)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
futures = "0.3"

# Utilities
tempfile = "3"
phf = { version = "0.11", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
