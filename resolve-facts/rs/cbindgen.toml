language = "C++"
namespace = "facts_rs"
pragma_once = true
include_guard = "RESOLVE_FACTS_RS_H"
header = """
/*
 * Generated by cbindgen from resolve-facts/rs. Do not edit by hand.
 */
"""

[parse]
parse_deps = false

[parse.expand]
crates = ["facts-rs"]

[export]
include = [
  "Node",
  "Edge",
  "ModuleHeader",
  "FactsPath",
  "FactsReadResult",
  "FactsModuleCursor",
  "FactsModuleView",
]
